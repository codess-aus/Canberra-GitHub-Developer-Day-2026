# Builds the MkDocs site and publishes it to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# The minimum permissions the Pages deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish, but skip any older queued ones
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip

      - run: pip install -r requirements.txt

      # --strict turns broken links and bad templates into build failures
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
